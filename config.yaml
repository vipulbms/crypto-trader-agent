# ──────────────────────────────────────────────
# Paper trading mode
# ──────────────────────────────────────────────
paper:
  starting_balance_usd: 1000
  slippage_pct: 0.05          # Simulated fill slippage (%) — applied on both entry and exit (#140)
  maker_fee_pct: 0.26         # Kraken maker fee — applied to every paper fill
  require_kraken_private_api: false

# ──────────────────────────────────────────────
# Technical analysis — indicator settings
# ──────────────────────────────────────────────
indicators:
  rsi_period: 14
  rsi_oversold: 30        # Data-backed: fires 7-11% of candles (was 35 = 13-22%, too loose)
  rsi_overbought: 75      # Raised from 65: prevents premature SELL signals in RSI 65-75 range (score 3 alone = sell_min_score)
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 50           # 50×15-min = 12.5 hrs; prevents band-squeeze false signals (was 20)
  bb_std: 2
  bb_min_width_pct: 0.5   # Ignore BB signals when band gap < 0.5% of price (squeezed bands = noise)
  bb_buy_tolerance_pct: 0.5   # Price may be up to 0.5% above lower BB and still count as a touch
  bb_sell_tolerance_pct: 0.5  # Price may be up to 0.5% below upper BB and still count as a touch
  ema_fast: 20
  ema_slow: 200           # 200×15-min = 50 hrs (~2 days) — genuine slow trend for EMA crossover
  atr_period: 14
  adx_period: 14               # ADX trend strength period (Wilder, standard = 14) (#134)
  obv_trend_period: 10         # Candles to look back for OBV trend comparison — per-pair override supported (#136)
  obv_noise_threshold: 0.001   # OBV change % floor below which trend is "flat" — per-pair override supported (#185)
  candle_buffer_size: 300     # 300×15-min = 75 hrs; covers ema_slow(200) warmup + headroom
  candle_interval: 15         # 15-min candles — aligned with cycle_interval_minutes
  min_candles_to_start: 220   # Minimum candles before first decision cycle (covers ema_slow warmup)
  buffer_fill_timeout_secs: 300   # Max wait for candle buffer to fill at startup (seconds)
  buffer_check_interval_secs: 5   # How often to poll buffer readiness at startup (seconds)

# ──────────────────────────────────────────────
# Signal scoring — weights and thresholds
# (controls buy/sell sensitivity — tune with care)
# ──────────────────────────────────────────────
signals:
  # ── BUY score weights ─────────────────────────────────────────────────────
  # Multiple signals must align — no single indicator triggers a buy.
  rsi_oversold_score: 3           # RSI < rsi_oversold (strong dip)
  rsi_mild_oversold_score: 1      # RSI 30-40 (moderate dip)
  macd_turn_positive_score: 3     # MACD histogram turned positive this candle (momentum crossover)
  macd_hist_positive_score: 1     # MACD histogram > 0 but not a fresh turn
  macd_crossover_score: 1         # MACD line crossed above signal line
  bb_lower_score: 2               # Price at/near lower Bollinger Band
  ema_short_uptrend_score: 2      # EMA9 > EMA21 (short-term momentum turning up)
  ema_medium_trend_score: 1       # Price > EMA50 (medium-term trend support — bonus, not a blocker)
  fear_greed_fear_score: 1        # Fear & Greed Index <= 40 (market fear = buy context)
  fear_greed_extreme_score: 1     # Fear & Greed Index <= 25 (extreme fear — stacks with above)
  adx_trend_weight: 1             # ADX > 40 → +1 BUY; ADX < 20 → -1 BUY (soft modifier) (#134)
  rsi_divergence_bullish_weight: 2          # Regular bullish divergence (price LL + RSI HL) (#135)
  rsi_divergence_hidden_bullish_weight: 1   # Hidden bullish divergence (price HL + RSI LL) (#135)
  rsi_divergence_bearish_weight: 2          # Regular bearish divergence (price HH + RSI LH) (#135)
  rsi_divergence_lookback: 20     # Candles to look back for divergence detection — per-pair override supported (#135)
  obv_accumulation_weight: 1      # OBV rising (smart money accumulating) → +1 BUY (#136)
  bb_squeeze_release_weight: 2    # BB squeeze release (price breaks above midband after compression) → +2 BUY (#137)
  bb_squeeze_release_expansion_factor: 1.2  # BB width must expand to threshold × 1.2 to qualify as release (#137)
  bb_squeeze_release_lookback: 3  # Number of prior candles that must all be in squeeze (#137)
  hammer_weight: 1                # Hammer candle (long lower wick) → +1 BUY (#184)
  engulfing_weight: 2             # Bullish engulfing (current engulfs prior bearish body) → +2 BUY (#184)
  doji_support_weight: 1          # Doji at BB lower band (indecision at support, body < 10% ATR) → +1 BUY (#184)
  max_score: 28                   # Updated: +3 from candlestick patterns (hammer+1, engulfing+2, doji+1 max)

  # ── SELL score weights ────────────────────────────────────────────────────
  rsi_overbought_score: 3         # RSI above rsi_overbought threshold
  macd_hist_negative_score: 2     # MACD histogram < 0 (bearish momentum)
  bb_upper_score: 2               # Price at/near upper Bollinger Band

  # ── Decision thresholds ───────────────────────────────────────────────────
  buy_min_score: 5                # Need ~2-3 signals aligned (e.g. RSI oversold + MACD turn = 6)
  sell_min_score: 3               # Any one strong sell signal is sufficient

  # ── Profit factor auto-escalation (#183) ─────────────────────────────────
  # Pairs with rolling 30-day PF < 1.0 have buy_min_score raised each cycle.
  # Minimum 10 closed trades required before escalation fires.
  profit_factor_escalation:
    enabled: true
    lookback_days: 30         # Rolling window for trade history
    min_trades: 10            # Minimum closed trades before escalation fires
    pf_warn_threshold: 1.0    # PF < 1.0 → +1 buy_min_score
    pf_severe_threshold: 0.7  # PF < 0.7 → +2 buy_min_score

# ──────────────────────────────────────────────
# LLM settings
# ──────────────────────────────────────────────
#llm:
#  provider: ollama              # ollama | openai_compat
#  model: qwen3.5:9b
#  fallback_model: qwen3.5:9b
#  base_url: http://localhost:11434
#  timeout_seconds: 600
#  max_reasoning_chars: 1000   # Max chars stored in audit reasoning_summary

# Groq via OpenAI-compatible endpoint
llm:
  provider: openai_compat
  model: qwen/qwen3-32b
  fallback_model: llama-3.3-70b-versatile
  base_url: https://api.groq.com/openai/v1/
  api_key_env: GROQ_API_KEY
  timeout_seconds: 30
  max_reasoning_chars: 1000
  request_delay_seconds: 3     # Rate limit: 6,000 TPM free tier; 30-min cycle interval is safe
  disable_thinking: true        # qwen3 on Groq: suppress <think> blocks to protect tool dispatch (#177)
  system_prompt: |
    You are Kryptos, a quantitative AI crypto trading agent managing a real portfolio on Kraken. Every 30 minutes you receive ranked market signals and portfolio state. Act by calling tools; all pairs not acted on are implicitly held.

    ## Tools
    - `propose_buy(pair, usd_amount)` — open a new position
    - `propose_sell(pair)` — close an existing position
    - `hold` is implicit — no call needed

    ## When to call propose_buy
    Call propose_buy when ALL of the following are true:
    1. Signal = BUY (confluence threshold already met by signal engine — do not second-guess it)
    2. OBI >= 0 (shown in signal block; negative OBI blocks entry)
    3. Not already holding the pair
    4. `usd_amount` <= the pair's `Max buy size` shown in the signal block

    Rank BUY candidates by confluence quality. Strongest: RSI oversold + MACD histogram just turned positive + price near BB lower band. Prefer higher MACD histogram magnitude as tiebreaker.

    At most `max_buys_per_cycle` propose_buy calls per cycle (shown in prompt header).

    ## When to call propose_sell
    Call propose_sell only when ALL three hold simultaneously:
    1. Position P&L >= 60% of its TP target (e.g. >=12% on a 20% TP pair). Code-enforced — calls below this are rejected.
    2. Signal = SELL with MACD histogram crossed negative AND RSI above pair overbought level.
    3. Projected P&L > 1%.

    Stop-loss and trailing stop exits are automatic. Never call propose_sell because price is falling.

    ## Regime overrides
    Bearish + rising BTC dominance: Prefer BTC/ETH/BNB. Tier 3/4 alt `Max buy size` is already reduced in the signal block — respect it exactly.

    [CYCLE TOP WARNING] present: Do not propose Tier 3/4 buys — hard-blocked by risk manager. Restrict to BTC/USD, ETH/USD, BNB/USD or make zero buys.

    ## Hard constraints the LLM can trip
    - OBI < 0 -> do not propose_buy (LLM must self-enforce — not in risk manager)
    - usd_amount > pair_max_usd -> rejected by risk manager; check signal block before calling
    - Exceeding max_buys_per_cycle -> excess calls are ignored; stay within the shown limit
    - Cycle-top warning active -> Tier 3/4 buy calls are hard-blocked; do not waste tool calls

    ## What NOT to do
    - Do not propose_buy when OBI is negative
    - Do not propose_buy Tier 3/4 pairs when [CYCLE TOP WARNING] is active
    - Do not exceed pair_max_usd shown in the signal block
    - Do not propose_sell below 60% TP proximity — it will be rejected silently
    - Do not treat ADX < 20 alone as a reason to skip a BUY — it is a soft -1 modifier, not a veto
    - Do not call propose_sell because a position is losing — automatic stops handle that

    Explain your reasoning in one sentence before each tool call.

