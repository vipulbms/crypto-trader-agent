# ══════════════════════════════════════════════════════════════
# Kryptos — AI Crypto Trading Agent — Configuration
# ══════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────
# Trading parameters
# ──────────────────────────────────────────────
trading:
  stop_loss_pct: 5            # Fixed — not recommended to change
  min_profit_floor_pct: 1.0   # Min PNL needed to close a position (covers fees/slippage)
  early_sell_min_tp_proximity_pct: 60  # LLM cannot propose_sell until P&L >= this % of TP target (code-enforced BRD FR-20)

  # Global default take-profit. Overridden per pair below.
  # Allowed values: 5 | 8 | 12 | 16 | 20
  take_profit_pct: 8

  # Allowed take-profit levels — validated at startup
  allowed_take_profit_pcts: [5, 8, 12, 16, 20]

  max_position_pct: 20        # Max % of portfolio per single trade (Fix #130 — was 15)
  max_open_positions: 13      # No effective cap — up to all 13 standard pairs (Fix #116 — was 5)
  max_buys_per_cycle: 7       # LLM may propose at most this many buys per cycle (Fix #130 — was 5)
  cycle_interval_minutes: 15  # How often the agent runs a decision cycle

  # Time-of-day filter to avoid low-volume false breakouts
  allowed_trading_hours:
    enabled: false
    start_hour_utc: 19   # 03:00 SGT (UTC+8)
    end_hour_utc: 20     # 04:00 SGT (UTC+8) — end is exclusive; allows 19:00–19:59 UTC only
    min_volume_ratio: 0.5 # Current volume must be at least this fraction of 20-period moving average

  pairs:
    # pair:      display name used throughout the agent
    # ws_name:   Kraken WebSocket v2 symbol (wss://ws.kraken.com/v2)
    # rest_name: Kraken public REST OHLC symbol (api.kraken.com/0/public/OHLC)
    - pair: BTC/USD
      ws_name: XBT/USD
      rest_name: XBTUSD
      take_profit_pct: 8      # BTC moves slowly — conservative target
      stop_loss_pct: 5
      atr_tp_min_pct: 0.14    # p25 ATR% 0.14 × 0.8; hard floor — blocks only genuine compression
      rsi_oversold: 30        # <30 fires 4.67% of candles — target band 5-8%
      rsi_overbought: 75      # >70 fires 4.39% — 75 keeps signal selective
      bb_squeeze_threshold_pct: 0.7   # p10 BB width from 2025 data
      min_volume_ratio: 0.50  # dead zone 44% — standard threshold appropriate
      adaptive_atr_floor_lookback: 200  # 50h rolling window — faster regime adaptation (#141)
      caution_factor_bearish: 0.8   # low bearish DD (0.90%) — slight caution only (#124)
      rsi_divergence_lookback: 25   # slow mover — longer window gives more reliable swing confirmation (#135)
    - pair: ETH/USD
      ws_name: ETH/USD
      rest_name: ETHUSD
      take_profit_pct: 12
      stop_loss_pct: 5
      atr_tp_min_pct: 0.23    # p25 ATR% 0.29 × 0.8
      rsi_oversold: 30
      rsi_overbought: 75
      bb_squeeze_threshold_pct: 1.3
      min_volume_ratio: 0.50  # dead zone 47%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 1.0   # proven winner — buy the dip, no reduction (#124)
      buy_min_score: 5              # strong win rate — keep global threshold (#128)
    - pair: BNB/USD
      ws_name: BNB/USD
      rest_name: BNBUSD
      take_profit_pct: 12
      stop_loss_pct: 5
      atr_tp_min_pct: 0.15    # p25 ATR% 0.16 × 0.8 = 0.13 → min cap 0.15
      rsi_oversold: 28        # <30 only 3.48% — lower to 28 to reach ~5% band
      rsi_overbought: 75
      bb_squeeze_threshold_pct: 0.9
      min_volume_ratio: 0.30  # dead zone 56.6% — lower to avoid over-blocking
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 1.0   # proven winner — buy the dip, no reduction (#124)
      buy_min_score: 5              # strong win rate — keep global threshold (#128)
    - pair: SOL/USD
      ws_name: SOL/USD
      rest_name: SOLUSD
      take_profit_pct: 16     # SOL is volatile — can reach larger moves
      stop_loss_pct: 5
      atr_tp_min_pct: 0.30    # p25 ATR% 0.38 × 0.8
      rsi_oversold: 30
      rsi_overbought: 75
      bb_squeeze_threshold_pct: 1.8
      min_volume_ratio: 0.50  # dead zone 44%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.6   # median bearish DD 1.93% — moderate caution (#124)
      buy_min_score: 6              # 44% win rate at score 5 — raise bar (#128)
    - pair: XRP/USD
      ws_name: XRP/USD
      rest_name: XRPUSD
      take_profit_pct: 12     # High volatility, news-driven spikes
      stop_loss_pct: 5
      atr_tp_min_pct: 0.26    # p25 ATR% 0.33 × 0.8
      rsi_oversold: 28        # <30 only 3.69% — lower to 28
      rsi_overbought: 72      # >70 only 3.43% — lower to 72 for more sensitivity
      bb_squeeze_threshold_pct: 1.4
      min_volume_ratio: 0.50  # dead zone 41%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.8   # low-moderate bearish DD 1.43% (#124)
    - pair: TRX/USD
      ws_name: TRX/USD
      rest_name: TRXUSD
      take_profit_pct: 12     # TRX is volatile — can reach larger moves
      stop_loss_pct: 5
      atr_tp_min_pct: 0.12    # p25 ATR% 0.12 × 0.8 = 0.10 → min cap 0.12
      rsi_oversold: 35        # <30 fires 6.87% — too noisy; raise to 35
      rsi_overbought: 65      # >70 fires 6.65% — lower bar to 65
      bb_squeeze_threshold_pct: 0.8
      min_volume_ratio: 0.40  # dead zone 52.9%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.8   # low bearish DD 1.05% (#124)
      rsi_divergence_lookback: 15   # noisy/fast pair — shorter window avoids false divergences (#135)
    - pair: DOGE/USD
      ws_name: DOGE/USD
      rest_name: XDGUSD
      take_profit_pct: 20     # Extremely meme-driven, can swing 20-30% in hours
      stop_loss_pct: 5
      atr_tp_min_pct: 0.31    # p25 ATR% 0.39 × 0.8
      rsi_oversold: 30
      rsi_overbought: 72      # >70 only 3.78% — lower to 72
      bb_squeeze_threshold_pct: 1.8
      min_volume_ratio: 0.40  # dead zone 51.5%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 1.0   # proven winner — buy the dip, no reduction (#124)
      buy_min_score: 5              # profitable pair — keep global threshold (#128)
      rsi_divergence_lookback: 15   # meme coin — fast swings, shorter window (#135)
    - pair: ADA/USD
      ws_name: ADA/USD
      rest_name: ADAUSD
      take_profit_pct: 12     # Moderate volatility, similar to ETH
      stop_loss_pct: 5
      atr_tp_min_pct: 0.32    # p25 ATR% 0.40 × 0.8
      rsi_oversold: 30
      rsi_overbought: 72      # >70 only 3.72% — lower to 72
      bb_squeeze_threshold_pct: 1.9
      min_volume_ratio: 0.40  # dead zone 52.1%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.6   # median bearish DD 1.83% (#124)
    - pair: LTC/USD
      ws_name: LTC/USD
      rest_name: LTCUSD
      take_profit_pct: 12     # Follows BTC with amplified moves (1.5–2x)
      stop_loss_pct: 5
      atr_tp_min_pct: 0.26    # p25 ATR% 0.32 × 0.8
      rsi_oversold: 28        # <30 only 3.84% — lower to 28
      rsi_overbought: 72      # >70 only 3.66% — lower to 72
      bb_squeeze_threshold_pct: 1.5
      min_volume_ratio: 0.40  # dead zone 49.7%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.8   # low-moderate bearish DD 1.39% (#124)
      rsi_divergence_lookback: 25   # slow mover (follows BTC) — longer window (#135)
    # RAILS/USD disabled — 25% win rate, 3/4 stop losses in production (#132)
    # - pair: RAILS/USD
    #  ws_name: RAILS/USD
    #  rest_name: RAILSUSD
    #  take_profit_pct: 20     # Extremely meme-driven, can swing 20-30% in hours
    #  stop_loss_pct: 5
    #  atr_tp_min_pct: 0.30    # no history — conservative default matching SOL
    #  rsi_oversold: 30
    #  rsi_overbought: 72
    #  bb_squeeze_threshold_pct: 1.8
    #  min_volume_ratio: 0.30  # thin liquidity — conservative dead zone threshold
    #  adaptive_atr_floor_lookback: 400
    #  caution_factor_bearish: 0.25  # 3/4 stop losses — cut harder (#131)
   #   buy_min_score: 7              # poor track record — require strong confluence (#131)
    - pair: AVAX/USD
      ws_name: AVAX/USD
      rest_name: AVAXUSD
      take_profit_pct: 12     # Reduced from 16 — tighter target for faster exits
      stop_loss_pct: 5
      atr_tp_min_pct: 0.31    # p25 ATR% 0.39 × 0.8
      rsi_oversold: 30
      rsi_overbought: 75      # >70 fires 4.33% — 75 appropriate
      bb_squeeze_threshold_pct: 2.0
      min_volume_ratio: 0.40  # dead zone 53.6%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.6   # median bearish DD 1.90% (#124)
    - pair: SUI/USD
      ws_name: SUI/USD
      rest_name: SUIUSD
      take_profit_pct: 20     # High beta L1, aggressive swings common
      stop_loss_pct: 5
      atr_tp_min_pct: 0.37    # p25 ATR% 0.46 × 0.8
      rsi_oversold: 30
      rsi_overbought: 72      # >70 only 3.95% — lower to 72
      bb_squeeze_threshold_pct: 2.1
      min_volume_ratio: 0.50  # dead zone 47.7%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.35  # high bearish DD 2.19% — cut harder (#124)
    - pair: HYPE/USD
      ws_name: HYPE/USD
      rest_name: HYPEUSD
      take_profit_pct: 20     # High volatility DeFi token, wide swings expected
      stop_loss_pct: 5
      atr_tp_min_pct: 0.30    # no history — conservative default
      rsi_oversold: 30
      rsi_overbought: 72
      bb_squeeze_threshold_pct: 2.0
      min_volume_ratio: 0.30  # thin liquidity
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.4   # high volatility, unpredictable — cut hard (#124)
      rsi_divergence_lookback: 15   # high-volatility DeFi — fast swings, shorter window (#135)
    - pair: UNI/USD
      ws_name: UNI/USD
      rest_name: UNIUSD
      take_profit_pct: 12     # DeFi blue chip, moderate-high volatility
      stop_loss_pct: 5
      atr_tp_min_pct: 0.30    # p25 ATR% 0.37 × 0.8
      rsi_oversold: 30
      rsi_overbought: 75      # >70 fires 4.03% — 75 appropriate
      bb_squeeze_threshold_pct: 2.1
      min_volume_ratio: 0.30  # dead zone 57.9%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.5   # underperformer — global default (#124)
      buy_min_score: 6              # 50% win rate at score 5 — raise bar (#128)
    - pair: INJ/USD
      ws_name: INJ/USD
      rest_name: INJUSD
      take_profit_pct: 20     # High volatility DeFi/L1 hybrid, wide swings common
      stop_loss_pct: 5
      atr_tp_min_pct: 0.34    # p25 ATR% 0.42 × 0.8
      rsi_oversold: 30
      rsi_overbought: 72      # >70 only 3.84% — lower to 72
      bb_squeeze_threshold_pct: 2.5
      min_volume_ratio: 0.30  # dead zone 58.3%
      adaptive_atr_floor_lookback: 200
      caution_factor_bearish: 0.35  # highest bearish DD 2.23% — cut harder (#124)
      buy_min_score: 7              # 30% win rate at score 5 — tighten significantly (#128)

# ──────────────────────────────────────────────
# Paper trading mode
# ──────────────────────────────────────────────
paper:
  starting_balance_usd: 1000
  slippage_pct: 0.05          # Simulated fill slippage (%) — applied on both entry and exit (#140)
  maker_fee_pct: 0.26         # Kraken maker fee — applied to every paper fill
  require_kraken_private_api: false

# ──────────────────────────────────────────────
# Technical analysis — indicator settings
# ──────────────────────────────────────────────
indicators:
  rsi_period: 14
  rsi_oversold: 30        # Data-backed: fires 7-11% of candles (was 35 = 13-22%, too loose)
  rsi_overbought: 75      # Raised from 65: prevents premature SELL signals in RSI 65-75 range (score 3 alone = sell_min_score)
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 50           # 50×15-min = 12.5 hrs; prevents band-squeeze false signals (was 20)
  bb_std: 2
  bb_min_width_pct: 0.5   # Ignore BB signals when band gap < 0.5% of price (squeezed bands = noise)
  bb_buy_tolerance_pct: 0.5   # Price may be up to 0.5% above lower BB and still count as a touch
  bb_sell_tolerance_pct: 0.5  # Price may be up to 0.5% below upper BB and still count as a touch
  ema_fast: 20
  ema_slow: 200           # 200×15-min = 50 hrs (~2 days) — genuine slow trend for EMA crossover
  atr_period: 14
  adx_period: 14               # ADX trend strength period (Wilder, standard = 14) (#134)
  obv_trend_period: 10         # Candles to look back for OBV trend comparison — per-pair override supported (#136)
  candle_buffer_size: 300     # 300×15-min = 75 hrs; covers ema_slow(200) warmup + headroom
  candle_interval: 15         # 15-min candles — aligned with cycle_interval_minutes
  min_candles_to_start: 220   # Minimum candles before first decision cycle (covers ema_slow warmup)
  buffer_fill_timeout_secs: 300   # Max wait for candle buffer to fill at startup (seconds)
  buffer_check_interval_secs: 5   # How often to poll buffer readiness at startup (seconds)

# ──────────────────────────────────────────────
# Signal scoring — weights and thresholds
# (controls buy/sell sensitivity — tune with care)
# ──────────────────────────────────────────────
signals:
  # ── BUY score weights ─────────────────────────────────────────────────────
  # Multiple signals must align — no single indicator triggers a buy.
  rsi_oversold_score: 3           # RSI < rsi_oversold (strong dip)
  rsi_mild_oversold_score: 1      # RSI 30-40 (moderate dip)
  macd_turn_positive_score: 3     # MACD histogram turned positive this candle (momentum crossover)
  macd_hist_positive_score: 1     # MACD histogram > 0 but not a fresh turn
  macd_crossover_score: 1         # MACD line crossed above signal line
  bb_lower_score: 2               # Price at/near lower Bollinger Band
  ema_short_uptrend_score: 2      # EMA9 > EMA21 (short-term momentum turning up)
  ema_medium_trend_score: 1       # Price > EMA50 (medium-term trend support — bonus, not a blocker)
  fear_greed_fear_score: 1        # Fear & Greed Index <= 40 (market fear = buy context)
  fear_greed_extreme_score: 1     # Fear & Greed Index <= 25 (extreme fear — stacks with above)
  adx_trend_weight: 1             # ADX > 40 → +1 BUY; ADX < 20 → -1 BUY (soft modifier) (#134)
  rsi_divergence_bullish_weight: 2          # Regular bullish divergence (price LL + RSI HL) (#135)
  rsi_divergence_hidden_bullish_weight: 1   # Hidden bullish divergence (price HL + RSI LL) (#135)
  rsi_divergence_bearish_weight: 2          # Regular bearish divergence (price HH + RSI LH) (#135)
  rsi_divergence_lookback: 20     # Candles to look back for divergence detection — per-pair override supported (#135)
  obv_accumulation_weight: 1      # OBV rising (smart money accumulating) → +1 BUY (#136)
  bb_squeeze_release_weight: 2    # BB squeeze release (price breaks above midband after compression) → +2 BUY (#137)
  bb_squeeze_release_expansion_factor: 1.2  # BB width must expand to threshold × 1.2 to qualify as release (#137)
  bb_squeeze_release_lookback: 3  # Number of prior candles that must all be in squeeze (#137)
  max_score: 25                   # Updated: +3 from new signals (OBV+1, BB squeeze release+2)

  # ── SELL score weights ────────────────────────────────────────────────────
  rsi_overbought_score: 3         # RSI above rsi_overbought threshold
  macd_hist_negative_score: 2     # MACD histogram < 0 (bearish momentum)
  bb_upper_score: 2               # Price at/near upper Bollinger Band

  # ── Decision thresholds ───────────────────────────────────────────────────
  buy_min_score: 5                # Need ~2-3 signals aligned (e.g. RSI oversold + MACD turn = 6)
  sell_min_score: 3               # Any one strong sell signal is sufficient

# ──────────────────────────────────────────────
# LLM settings
# ──────────────────────────────────────────────
#llm:
#  provider: ollama              # ollama | openai_compat
#  model: qwen3.5:9b
#  fallback_model: qwen3.5:9b
#  base_url: http://localhost:11434
#  timeout_seconds: 600
#  max_reasoning_chars: 1000   # Max chars stored in audit reasoning_summary

# Gemini via OpenAI-compatible endpoint (comment out llm block above and uncomment below)
llm:
  provider: openai_compat
  model: gemini-2.5-flash
  fallback_model: gemini-2.5-flash
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: GEMINI_API_KEY
  timeout_seconds: 60
  max_reasoning_chars: 1000
  request_delay_seconds: 6     # Rate limit: stay at 10 req/min (safe under 15 req/min free tier)

# ──────────────────────────────────────────────
# Notifications
# ──────────────────────────────────────────────
notifications:
  telegram_enabled: true
  approval_timeout_seconds: 300
  daily_report_hour_utc: 23
  heartbeat_interval_minutes: 60   # Send "still alive" summary every N minutes (live mode only)
  healthcheck_url: ""              # Webhook to ping after every cycle successfully completes (e.g. healthchecks.io)

# ──────────────────────────────────────────────
# Risk limits
# ──────────────────────────────────────────────
risk:
  daily_loss_limit_pct: 10    # Stop all trading if daily loss exceeds 10%
  global_max_daily_loss_pct: 7.0  # Kill Switch: panic-sell all open positions if total account drops by this % from start of day
  min_cash_reserve_pct: 5     # Always keep at least 5% as cash (Fix #130 — was 10%)
  min_order_usd: 20.0
  max_token_volume_per_trade: 500000
  flash_crash_tolerance_pct: 15.0

  # Circuit breaker — pause all new buys after consecutive stop-losses ("revenge trading" prevention)
  circuit_breaker:
    enabled: true
    consecutive_stops: 3      # Trip after this many stop-losses in a row
    pause_hours: 4            # Backward compat flat override; ignored when pause_tiers_hours is set
    pause_tiers_hours: [1, 2, 4]  # Graduated backoff: 1st fire→1h, 2nd→2h, 3rd+→4h (#143)
    tier_reset_hours: 24          # Reset fire count if no new fires for this many hours

  # Correlation guard — block stacking highly-correlated pairs (#139)
  correlation_clusters:
    - name: large_cap_l1
      pairs: [BTC/USD, ETH/USD, BNB/USD, SOL/USD]   # ~0.85 rolling correlation
    - name: memecoins
      pairs: [DOGE/USD, HYPE/USD]
    - name: alt_l1
      pairs: [SUI/USD, AVAX/USD, INJ/USD]
    - name: payment_legacy
      pairs: [XRP/USD, TRX/USD, ADA/USD, LTC/USD]
  max_cluster_positions: 2    # Max open positions per cluster
  cluster_size_penalty: 0.5   # Multiply position size when cluster already has 1 open

# ──────────────────────────────────────────────
# Feature 1: Multi-pair context awareness
# Position sizing scaled by signal strength and ATR volatility
# ──────────────────────────────────────────────
position_sizing:
  enabled: true
  base_position_pct: 16         # Base % of portfolio per trade (before scaling; Fix #130 — was 12)
  strength_weight: 0.5          # How much signal strength influences size (0=ignore, 1=full)
  volatility_weight: 0.5        # How much ATR volatility reduces size (0=ignore, 1=full)
  min_position_pct: 5           # Never allocate less than this % of portfolio
  max_position_pct: 20          # Hard cap (aligned with risk.max_position_pct; Fix #130 — was 15)

# ──────────────────────────────────────────────
# Feature: ATR-based stop-loss at entry (S12.4.1 — #86)
# SL = (atr_multiplier × ATR / entry_price) × 100, clamped to [min, max]
# When disabled, falls back to trading.stop_loss_pct (5%)
# ──────────────────────────────────────────────
atr_stop_loss:
  enabled: true
  atr_multiplier: 1.5       # SL distance = ATR × multiplier
  max_stop_loss_pct: 5.0    # Hard cap — never wider than 5%
  min_stop_loss_pct: 1.0    # Floor — never tighter than 1%

# ──────────────────────────────────────────────
# Feature: Adaptive ATR floor (Fix #108)
# Per-cycle, rolling p25 ATR% per pair is injected into indicators as
# adaptive_atr_floor_pct. Overrides static per-pair atr_tp_min_pct in
# signals.py Hard Blocker 2. Per-pair lookback via adaptive_atr_floor_lookback.
# ──────────────────────────────────────────────
adaptive_atr_floor:
  enabled: true
  scaling_factor: 0.8   # floor = p25_atr_pct × scaling_factor
  min_cap_pct: 0.10     # absolute minimum regardless of rolling p25
  lookback_candles: 200 # global default; per-pair override via adaptive_atr_floor_lookback

# ──────────────────────────────────────────────
# Feature: Adaptive BB squeeze threshold (Fix #113)
# Per-cycle, rolling p10 BB width% per pair is injected into indicators as
# _rolling_bb_p10_pct. features.py compute_dynamic_tp() reads this first,
# then falls back to per-pair bb_squeeze_threshold_pct, then global.
# ──────────────────────────────────────────────
adaptive_bb_squeeze:
  enabled: true
  lookback_candles: 200  # global default; per-pair override not yet exposed
  percentile: 10         # p10 of BB width% — defines "squeezed" market baseline

# ──────────────────────────────────────────────
# Feature: Adaptive volume floor (Fix #114)
# Per-cycle, rolling p15 raw volume per pair is injected into indicators as
# rolling_volume_p15. signals.py Hard Blocker 3 uses this first, then falls back
# to SMA-ratio check using per-pair min_volume_ratio.
# ──────────────────────────────────────────────
adaptive_volume_floor:
  enabled: true
  lookback_candles: 200  # global default
  percentile: 15         # p15 of raw volume — candles below this are dead-zone

# ──────────────────────────────────────────────
# Feature 2: Dynamic take-profit targets
# TP adjusted based on ATR and Bollinger Band width
# ──────────────────────────────────────────────
dynamic_tp:
  enabled: true
  atr_multiplier: 2.0           # TP = entry + (ATR × multiplier); compared to configured TP
  bb_width_scale: true          # Widen TP when BB is wide; narrow it when squeezed
  min_tp_pct: 5                 # Never set TP below this % (must be in allowed_take_profit_pcts)
  max_tp_pct: 20                # Never set TP above this %
  squeeze_threshold_pct: 1.0    # BB width % below which TP is reduced to min_tp_pct
  atr_tp_min_pct: 0.30          # Global fallback only — per-pair atr_tp_min_pct in trading.pairs[] takes priority (Fix #107)

# ──────────────────────────────────────────────
# Feature: Trailing stop-loss (S12.2.1 — #84)
# Activates once position gains activate_after_pct; then trails highest price
# by trail_pct. Cannot be enabled simultaneously with breakeven_stop.
# ──────────────────────────────────────────────
trailing_stop:
  enabled: true
  trail_pct: 5.0              # Trail SL by this % below highest price seen (was 3.0)
  activate_after_pct: 3.0     # Only activate once position is up this % (was 1.5)
  per_pair_overrides:         # Override trail_pct and/or activate_after_pct per pair
    DOGE/USD:
      trail_pct: 7.0          # was scalar 5.0
      activate_after_pct: 5.0
    # RAILS/USD: disabled (#132)
    #   trail_pct: 7.0
    #   activate_after_pct: 5.0
    HYPE/USD:
      trail_pct: 7.0
      activate_after_pct: 5.0
    SUI/USD:
      trail_pct: 6.0          # was scalar 4.0
      activate_after_pct: 4.0

# ──────────────────────────────────────────────
# Feature: Breakeven stop (S12.3.1 — #85)
# Moves SL to entry price once position is up trigger_pct.
# MUTUALLY EXCLUSIVE with trailing_stop — enabling both raises ConfigError.
# ──────────────────────────────────────────────
breakeven_stop:
  enabled: false              # Off by default; cannot be on with trailing_stop
  trigger_pct: 2.0            # Move SL to entry when position gains this %

# ──────────────────────────────────────────────
# Feature S12.5.1: Partial Take-Profit
# Closes a fraction of the position at mid-TP, lets the rest run to full TP.
# partial_exited DB flag prevents double-fire.
# ──────────────────────────────────────────────
partial_take_profit:
  enabled: true               # Enabled (#142) — locks in 50% profit mid-TP; SL raised to breakeven
  trigger_pct_of_tp: 50       # Fire when price is 50% of the way to full TP
  close_fraction: 0.5         # Close 50% of remaining volume
  move_sl_to_breakeven: true  # After partial exit, move SL to entry_price

# ──────────────────────────────────────────────
# Feature 3: Market regime detection
# Classifies current market as trending / ranging / bearish / volatile
# ──────────────────────────────────────────────
regime:
  enabled: true
  bearish_pairs_threshold: 6    # If >= N pairs have negative MACD, classify as bearish
  bullish_pairs_threshold: 6    # If >= N pairs have positive MACD, classify as bullish
  volatile_atr_multiplier: 1.5  # ATR > avg_atr × multiplier = volatile regime
  ranging_macd_threshold: 0.001 # |MACD histogram| < this = ranging (no momentum)
  bearish_caution_factor: 0.5   # Global fallback; per-pair caution_factor_bearish in trading.pairs[] overrides (#124)
  volatile_caution_factor: 0.7  # Multiply proposed position size by this in volatile regime

# ──────────────────────────────────────────────
# Feature 4: News & sentiment integration
# Pulls Fear & Greed Index and injects into LLM context
# ──────────────────────────────────────────────
sentiment:
  enabled: true
  fear_greed_url: "https://api.alternative.me/fng/?limit=1"
  fetch_timeout_secs: 5         # HTTP timeout for sentiment fetch
  cache_minutes: 60             # Re-fetch at most once per hour
  extreme_fear_threshold: 25    # Index <= this = extreme fear (potential buy zone)
  extreme_greed_threshold: 75   # Index >= this = extreme greed (caution on buys)

# ──────────────────────────────────────────────
# Feature 5: Audit trail pattern analysis
# Queries own trade history to surface win/loss patterns
# ──────────────────────────────────────────────
pattern_analysis:
  enabled: true
  lookback_days: 30             # How many days of history to analyse
  min_trades_for_pattern: 3     # Minimum trades per pair before pattern is reported
  cache_minutes: 60             # Re-compute at most once per hour (expensive query)

# ──────────────────────────────────────────────
# Feature 6: Exit timing on open positions
# Agent can close a position before SL/TP if momentum is decaying
# ──────────────────────────────────────────────
exit_timing:
  enabled: true
  min_hold_minutes: 60              # Never exit early before this many minutes
  macd_decay_threshold_pct: -0.005  # MACD histogram / price × 100 below this = decay (Fix #112)
                                    # Replaces absolute macd_decay_threshold — works for all pairs
  rsi_exit_overbought: 70           # Exit long if RSI rises above this
  sideways_candles: 8               # Exit if price hasn't moved > ATR for this many candles

# ──────────────────────────────────────────────
# Feature 7: Post-trade analysis
# LLM writes a brief analysis after each closed position
# ──────────────────────────────────────────────
post_trade:
  enabled: true
  min_hold_minutes: 15          # Only analyse trades held at least this long
  max_analysis_chars: 500       # Truncate stored analysis to this length

# ──────────────────────────────────────────────
# Exchange / WebSocket
# ──────────────────────────────────────────────
exchange:
  ws_ping_interval_secs: 20   # WebSocket keepalive ping frequency
  ws_max_backoff_secs: 60     # Max reconnect delay after disconnection

# ──────────────────────────────────────────────
# Storage & logging
# ──────────────────────────────────────────────
storage:
  paper_db: paper_trading.db
  live_db: live_trading.db
  audit_db: audit.db
  log_max_bytes: 104857600    # 100 MB per log file before rotation
  log_backup_count: 4         # Keep 1 active + 4 previous log files
  llm_debug_logging: false    # Set true to log full LLM prompts + HTTP responses to agent.log
