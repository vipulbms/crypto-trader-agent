name: Signal Backtest

on:
  pull_request:
    paths:
      - 'config.yaml'
      - 'src/analysis/**'
      - 'src/risk/**'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast backtest (signal-only, no LLM)
        run: python tests/test_backtest.py --no-llm --start-date 2025-12-01 2>&1 | tee backtest_output.txt

      - name: Check win rate threshold
        run: python scripts/check_backtest_result.py --input backtest_output.txt --min-win-rate 45

      - name: Post backtest summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('backtest_output.txt', 'utf8'); } catch(e) { output = 'No output captured.'; }

            const lines = output.split('\n');
            const totalLine = lines.find(l => l.includes('TOTAL'));
            const m = totalLine ? totalLine.match(/(\d+)%\s*$/) : null;
            const winRate = m ? parseInt(m[1]) : null;
            const status = winRate === null ? '⚠️' : winRate >= 45 ? '✅' : '❌';
            const winRateStr = winRate !== null ? `${winRate}%` : 'N/A';

            const body = [
              '## Fast Backtest Result (signal-only, no LLM)',
              '',
              `${status} **Overall win rate: ${winRateStr}** (pass threshold: ≥45%)`,
              '',
              '<details><summary>Full backtest output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '',
              '</details>',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
